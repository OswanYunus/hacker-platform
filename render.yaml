databases:
  - name: hacker-platform-db
    databaseName: hacker
    user: hacker
    plan: 0.5c-1g
    region: frankfurt

services:
  - type: pserv
    name: hacker-platform-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npx prisma generate --schema apps/api/prisma/schema.prisma && npm run build
    preDeployCommand: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
    startCommand: npm run start --workspace @hacker/api
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hacker-platform-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MASTER_ENCRYPTION_KEY
        generateValue: true
      - key: WEB_ORIGIN
        fromService:
          type: web
          name: hacker-platform-web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: SCAN_WORKER_CONCURRENCY
        value: "1"

  - type: web
    name: hacker-platform-web
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npx prisma generate --schema apps/api/prisma/schema.prisma && npm run build
    startCommand: npm run start --workspace @hacker/web
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_ORIGIN
        fromService:
          type: pserv
          name: hacker-platform-api
          property: hostport
